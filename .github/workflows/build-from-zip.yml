
name: Build Smart Reem APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find and extract Smart Reem source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            SOURCE_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No ZIP file found."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/smart-reem-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/smart-reem-source"
            PUBSPEC="$(find "$RUNNER_TEMP/smart-reem-source" -type f -name pubspec.yaml -print -quit)"
            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml not found."
              exit 1
            fi
            SOURCE_DIR="$(dirname "$PUBSPEC")"
          fi
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_PROJECT=$RUNNER_TEMP/smart-reem-android" >> "$GITHUB_ENV"

      - name: Generate a clean Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_PROJECT"
          flutter create --platforms=android --org com.smartreem --project-name smart_reem "$ANDROID_PROJECT"
          cp "$SOURCE_DIR/pubspec.yaml" "$ANDROID_PROJECT/pubspec.yaml"
          rm -rf "$ANDROID_PROJECT/lib" "$ANDROID_PROJECT/test"
          cp -R "$SOURCE_DIR/lib" "$ANDROID_PROJECT/lib"
          cp "$SOURCE_DIR/analysis_options.yaml" "$ANDROID_PROJECT/analysis_options.yaml"
          mkdir -p "$ANDROID_PROJECT/assets/images"
          cp "$SOURCE_DIR/assets/images/app_icon.png" "$ANDROID_PROJECT/assets/images/app_icon.png"
          rm -rf "$ANDROID_PROJECT/test"
          sed -i 's/android:label="[^"]*"/android:label="سمارت ريم"/' "$ANDROID_PROJECT/android/app/src/main/AndroidManifest.xml"

      - name: Install dependencies and create launcher icon
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze application source
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          flutter analyze lib

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT"
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Reem-APK
          path: ${{ runner.temp }}/smart-reem-android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
